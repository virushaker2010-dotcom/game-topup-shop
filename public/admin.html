<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand">⚙️ لوحة التحكم</div><a href="/">المتجر</a></header><main><section class="card"><h1>الطلبات</h1><div id="orders"></div><hr><h1>الباقات</h1><form id="pf"><select id="pg"><option>PUBG MOBILE</option><option>Free Fire</option></select><input id="pn" placeholder="اسم الباقة" required><input id="pa" placeholder="الكمية" required><input id="pp" type="number" placeholder="السعر EGP" required><button class="primary">إضافة</button></form><div id="products"></div></section></main>
<script>
const auth=()=>{let u=prompt("Admin username");let p=prompt("Admin password");return "Basic "+btoa(u+":"+p)}; const A=auth();
async function load(){let o=await fetch("/api/admin/orders",{headers:{Authorization:A}}); if(o.status==401)return location.reload();let os=await o.json();document.getElementById("orders").innerHTML=os.map(x=>`<div class="row"><b>#${x.id}</b> ${x.game} — ${x.product_name} — ${x.price} EGP — ID ${x.player_id} <select onchange="st(${x.id},this.value)">${["pending","paid","processing","completed","failed","cancelled"].map(s=>`<option ${s==x.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join("");
let p=await fetch("/api/admin/products",{headers:{Authorization:A}});let ps=await p.json();document.getElementById("products").innerHTML=ps.map(x=>`<div class="row">#${x.id} ${x.game} — ${x.name} — ${x.price} EGP — ${x.active?"نشط":"موقوف"}</div>`).join("")}
async function st(id,status){await fetch("/api/admin/orders/"+id,{method:"PATCH",headers:{Authorization:A,"Content-Type":"application/json"},body:JSON.stringify({status})});load()}
document.getElementById("pf").onsubmit=async e=>{e.preventDefault();await fetch("/api/admin/products",{method:"POST",headers:{Authorization:A,"Content-Type":"application/json"},body:JSON.stringify({game:pg.value,name:pn.value,amount:pa.value,price:Number(pp.value)})});e.target.reset();load()};load();
</script></body></html>
