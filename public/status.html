<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة الطلب</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand">🎮 Game TopUp</div><a href="/">الرئيسية</a></header><main><section class="card"><h1>متابعة الطلب</h1><input id="id" placeholder="رقم الطلب"><button class="primary" onclick="check()">بحث</button><div id="out"></div></section></main>
<script>const q=new URLSearchParams(location.search);document.getElementById("id").value=q.get("id")||"";async function check(){let id=document.getElementById("id").value;let r=await fetch("/api/orders/"+id),j=await r.json();document.getElementById("out").innerHTML=r.ok?`<div class="success"><b>طلب #${j.id}</b><br>${j.game} — ${j.product_name}<br>Player ID: ${j.player_id}<br>السعر: ${j.price} EGP<br>الحالة: <b>${j.status}</b></div>`:`<div class="error">${j.error}</div>`}</script></body></html>
